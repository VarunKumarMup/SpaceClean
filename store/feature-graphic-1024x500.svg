<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0A12"/>
      <stop offset="1" stop-color="#050509"/>
    </linearGradient>
    <radialGradient id="fc" cx="0.12" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fv" cx="0.85" cy="0.0" r="0.7">
      <stop offset="0" stop-color="#9D00FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9D00FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fb" cx="0.5" cy="1.1" r="0.9">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ftitle" x1="120" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7EF6FF"/>
    </linearGradient>
    <linearGradient id="fspark" x1="740" y1="150" x2="900" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="fring" x1="700" y1="120" x2="940" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#9D00FF"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#fbg)"/>
  <rect width="1024" height="500" fill="url(#fc)"/>
  <rect width="1024" height="500" fill="url(#fv)"/>
  <rect width="1024" height="500" fill="url(#fb)"/>

  <!-- Text block -->
  <text x="96" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800"
